name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check index.js
      - run: node --check solver.js
      - run: node --check auth.js
      - run: node --check helpers.js
      - run: node --check public/app.js
      - run: node --check public/ui-utils.js
      - run: npm test

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance tests
        run: npm run test:e2e
      - name: Upload browser reports, traces, screenshots, and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftsroute-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  worker-d1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Exercise Worker against isolated local D1
        run: npm run test:worker

  worker-preview-e2e:
    # PR #1 gets a dedicated synthetic-only D1 database and a separate test Worker.
    # Do not expose Cloudflare credentials to forked pull requests.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: shiftsroute-worker-preview-pr1
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare preview credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Preview skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets to enable live Worker and D1 browser tests."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: 22

      - name: Install project and browser dependencies
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Apply migrations to the dedicated E2E D1 database
        if: steps.credentials.outputs.available == 'true'
        run: npx wrangler d1 migrations apply raw-ter-shift-pr1-e2e --remote --config wrangler.routesa.e2e-preview.toml

      - name: Generate an ephemeral demo PIN
        if: steps.credentials.outputs.available == 'true'
        id: pin
        shell: bash
        run: |
          pin="$(node --input-type=module -e "import { randomInt } from 'node:crypto'; process.stdout.write(String(randomInt(0, 1000000)).padStart(6, '0'))")"
          echo "::add-mask::$pin"
          echo "value=$pin" >> "$GITHUB_OUTPUT"

      - name: Seed only synthetic accounts into isolated D1
        if: steps.credentials.outputs.available == 'true'
        env:
          E2E_DEMO_PIN: ${{ steps.pin.outputs.value }}
        run: node scripts/seed-e2e-preview.mjs

      - name: Deploy or update the isolated Cloudflare Worker Preview
        if: steps.credentials.outputs.available == 'true'
        id: deploy
        run: |
          npx wrangler preview --config wrangler.routesa.e2e-preview.toml --name "pr-${{ github.event.pull_request.number }}" --message "shiftsRoute PR #${{ github.event.pull_request.number }} ${{ github.sha }}" --json > worker-preview.json
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const output = readFileSync("worker-preview.json", "utf8");
            let parsed;
            try { parsed = JSON.parse(output); } catch {}
            const values = [];
            const visit = value => {
              if (typeof value === "string") values.push(value);
              else if (Array.isArray(value)) value.forEach(visit);
              else if (value && typeof value === "object") Object.values(value).forEach(visit);
            };
            visit(parsed);
            values.push(...(output.match(/https:\/\/[^\s"<>]+/g) || []));
            const url = values.map(value => value.trim().replace(/[),.;]+$/, "")).find(value => {
              try { return new URL(value).protocol === "https:" && new URL(value).hostname.endsWith(".workers.dev"); }
              catch { return false; }
            });
            if (!url) throw new Error("Wrangler did not return a workers.dev Preview URL. Inspect worker-preview.json and verify Preview URLs are enabled for this dedicated test Worker.");
            appendFileSync(process.env.GITHUB_OUTPUT, "url=" + url + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Cloudflare Worker Preview\n\n" + url + "\n");
          '

      - name: Exercise the real Worker and D1 in desktop and mobile browsers
        if: steps.credentials.outputs.available == 'true'
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_DEMO_PIN: ${{ steps.pin.outputs.value }}
        run: npx playwright test tests/e2e/worker-preview.spec.js

      - name: Upload real Worker Preview browser evidence
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shiftsroute-worker-preview-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            worker-preview.json
          if-no-files-found: ignore
          retention-days: 14
