name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check index.js
      - run: node --check solver.js
      - run: node --check auth.js
      - run: node --check helpers.js
      - run: node --check public/app.js
      - run: node --check public/ui-utils.js
      - run: npm test

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser-test dependencies
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance tests
        run: npm run test:e2e
      - name: Upload browser reports, traces, screenshots, and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftsroute-playwright-${{ github.run_id }}
          path:
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
