name = "shiftsroutes"
main = "index.js"
compatibility_date = "2026-07-24"
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "preview"

[[d1_databases]]
binding = "DB"
database_name = "raw-ter-shift-preview"
database_id = "754b2777-5bbf-4a6d-9da9-3e6f712f3611"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
